services:
  - type: web
    name: gumiho-love-saju
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PAYAPP_USERID
        sync: false
      - key: PAYAPP_LINKKEY
        sync: false
      - key: PAYAPP_LINKVAL
        sync: false
      - key: PAYAPP_REQUESTKEY
        sync: false
      - key: PAYAPP_PUBLIC_URL
        sync: false
      - key: SITE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
