<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>구미호 연애운 사주</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff1f7;color:#532c43;font-family:Georgia,'Noto Serif KR',serif}.wrap{max-width:520px;margin:auto;padding:24px 20px 70px}.hero{min-height:380px;text-align:center;background:linear-gradient(#f5eafa55,#fff1f7dd),url('hero.jpg') center/cover;border-radius:24px;padding:95px 12px 35px}.fox{width:105px;height:105px;object-fit:cover;border-radius:50%;border:3px solid #fff;box-shadow:0 6px 20px #7c507555}h1{font-size:34px;letter-spacing:-1px}h2{font-size:24px}.hero p{line-height:1.9;font-size:17px}.panel{background:#ffffffd9;border:1px solid #e9b6d0;border-radius:26px;padding:25px 20px;margin-top:24px;box-shadow:0 10px 30px #a96e8511}.choice{display:block;width:100%;background:#fff;border:1.5px solid #db9cbb;border-radius:16px;padding:17px 12px;color:#713e59;font-size:20px;margin:13px 0;cursor:pointer}.choice.active{background:#f9deef;border-color:#a65d91;font-weight:700}.field{display:block;margin:18px 0 8px;font-weight:bold}input,select{width:100%;padding:15px;border:1px solid #d6adc3;border-radius:12px;font-size:16px;background:white;color:#43243a}button.primary{width:100%;padding:17px;background:linear-gradient(110deg,#a65a91,#704179);color:white;border:0;border-radius:15px;font-size:18px;font-weight:bold;margin-top:22px;cursor:pointer}button:disabled{opacity:.5}.result{white-space:pre-wrap;line-height:1.9}.small{font-size:12px;line-height:1.7;color:#856a7a}.hidden{display:none}.error{color:#a02048}.pill{background:#f4e3ef;border-radius:12px;padding:10px;margin:7px 0}.moon{height:100px;background:url('moon.jpg') center/contain no-repeat}.footer{text-align:center;font-size:12px;margin:35px 0;color:#8e7182}</style></head><body><main class="wrap"><header class="hero"><img class="fox" src="fox.jpg" alt="구미호" onerror="this.style.display='none'"><h1>구미호 연애운 사주</h1><p>천 년의 기다림 끝에 깨어난 인연의 비밀.<br>당신의 사랑에 숨겨진 이야기를 만나보세요.</p></header><section class="panel"><h2>🌸 어떤 인연이 궁금한가요?</h2><button class="choice active" data-topic="love">💕 나의 연애운</button><button class="choice" data-topic="reunion">🌙 그 사람과의 재회운</button><button class="choice" data-topic="compatibility">💍 두 사람의 궁합</button><label class="field" for="birth">나의 생년월일 (양력)</label><input id="birth" type="date" required><label class="field" for="hour">태어난 시간</label><select id="hour"><option value="">모름</option></select><div id="other" class="hidden"><label class="field" for="otherBirth">상대방 생년월일 (양력)</label><input id="otherBirth" type="date"></div><button class="primary" id="previewBtn">무료 연애운 미리보기 ✨</button><p class="small">입력 정보는 분석 요청에만 사용합니다. 결제 전에는 무료 미리보기만 제공됩니다.</p></section><section id="resultPanel" class="panel hidden"><h2>🦊 구미호의 속삭임</h2><div id="previewResult" class="result"></div><div id="premiumArea"><div class="moon"></div><h2>🔮 더 깊은 인연의 이야기</h2><p>AI 프리미엄 해석은 결제 완료 후 열립니다.</p><p id="price"></p><button class="primary" id="payBtn" disabled>프리미엄 준비 중</button><p class="small">결제사는 별도로 연결해야 하며, 실제 결제 전 가격과 환불 조건을 확인해야 합니다.</p></div><div id="premiumResult" class="result"></div></section><p class="footer">구미호 연애운 사주 · 전통 명리학 기반 오락 및 자기성찰 콘텐츠</p></main><script>
const API=location.hostname.endsWith('github.io')?'https://gumiho-love-saju.onrender.com':'';
let topic='love',lastOrder=null,config={};const $=id=>document.getElementById(id);
for(let i=0;i<24;i++){let o=document.createElement('option');o.value=i;o.textContent=String(i).padStart(2,'0')+':00 ~ '+String(i).padStart(2,'0')+':59';$('hour').appendChild(o)}
document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{document.querySelectorAll('.choice').forEach(x=>x.classList.remove('active'));b.classList.add('active');topic=b.dataset.topic;$('other').classList.toggle('hidden',topic!=='compatibility')});
async function post(path,data){let r=await fetch(API+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});let j=await r.json();if(!r.ok)throw Error(j.error||'요청 실패');return j}
const payload=()=>({topic,birth:$('birth').value,hour:$('hour').value,other_birth:$('otherBirth').value});
$('previewBtn').onclick=async()=>{let b=$('previewBtn');b.disabled=true;b.textContent='사주를 살펴보는 중...';$('resultPanel').classList.remove('hidden');$('previewResult').textContent='';try{let r=await post('/api/preview',payload());let s=r.saju;let p=s.pillars;$('previewResult').textContent=`${r.title}\n\n연주 ${p.year} · 월주 ${p.month} · 일주 ${p.day}${p.hour?' · 시주 '+p.hour:''}\n일간: ${s.day_master}\n오행: ${Object.entries(s.elements).map(([k,v])=>k+' '+v).join(' / ')}\n\n${r.preview}\n\n${r.notice}`;$('resultPanel').scrollIntoView({behavior:'smooth'});}catch(e){$('previewResult').textContent=e.message;$('previewResult').classList.add('error')}finally{b.disabled=false;b.textContent='무료 연애운 미리보기 ✨'}};
async function init(){try{let r=await fetch(API+'/api/config');config=await r.json();$('price').textContent=config.payment_enabled?'프리미엄 분석 '+config.price.toLocaleString()+'원':'결제 기능 설정 전';$('payBtn').disabled=!config.payment_enabled;$('payBtn').textContent=config.payment_enabled?'프리미엄 결제하기':'프리미엄 준비 중'}catch(e){$('price').textContent='서버 연결 확인이 필요합니다.'}}init();
async function loadToss(){if(window.TossPayments)return;await new Promise((resolve,reject)=>{let s=document.createElement('script');s.src='https://js.tosspayments.com/v1/payment';s.onload=resolve;s.onerror=reject;document.head.appendChild(s)})}
$('payBtn').onclick=async()=>{try{let order=await post('/api/orders',payload());await loadToss();let successUrl=location.origin+location.pathname+'?payment=success',failUrl=location.origin+location.pathname+'?payment=fail';await TossPayments(config.client_key).requestPayment('카드',{amount:order.amount,orderId:order.orderId,orderName:order.orderName,customerName:'구미호 고객',successUrl,failUrl})}catch(e){alert(e.message)}};
(async()=>{let q=new URLSearchParams(location.search);if(q.get('payment')!=='success')return;$('resultPanel').classList.remove('hidden');$('previewResult').textContent='결제 승인 확인 중...';try{let orderId=q.get('orderId'),amount=Number(q.get('amount')),paymentKey=q.get('paymentKey');if(!orderId||!paymentKey||!Number.isSafeInteger(amount))throw Error('결제 정보가 없습니다.');await post('/api/payments/confirm',{orderId,paymentKey,amount});$('previewResult').textContent='결제가 확인되었습니다. AI 분석을 생성합니다.';let result=await post('/api/premium',{orderId});$('premiumResult').textContent=result.result;$('premiumArea').classList.add('hidden');$('previewResult').textContent='프리미엄 분석 결과';}catch(e){$('previewResult').textContent='결제/분석 확인: '+e.message+' 고객센터에 문의하거나 다시 시도해주세요.'}history.replaceState({},'',location.pathname)})();
</script></body></html>
